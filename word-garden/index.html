function renderLetters(){if(!session||session.answered)return;const s=session;$('#answerbox').innerHTML=s.spelling.length?s.spelling.map((i,idx)=>`<button class="letter" data-remove="${idx}" aria-label="移除字母 ${esc(s.letterbank[i].v)}">${esc(s.letterbank[i].v)}</button>`).join(''):'<span class="muted small" style="padding:15px">把字母放在這裡</span>';$('#letterbank').innerHTML=s.letterbank.map((o,i)=>`<button class="letter" data-letter="${i}" ${s.spelling.includes(i)?'disabled':''} aria-label="選字母 ${esc(o.v)}">${esc(o.v)}</button>`).join('');$('#check-spelling').disabled=s.spelling.length!==s.letterbank.length}
function record(id,skill,ok){const p=profile();p.progress[id]??={};let r=p.progress[id][skill]||{step:0,due:0,seen:0,right:0,lastDay:''};r.seen++;if(ok)r.right++;if(!ok){r.step=0;r.due=dueAfter(1)}else if(r.lastDay!==day()){r.step=Math.min(r.step+1,5);r.due=dueAfter([1,1,3,7,14,30][r.step])}r.lastDay=day();p.progress[id][skill]=r;save()}
function answer(id){if(!session||session.answered||current().type==='learn')return;const s=session,q=current(),w=word(q.id),ok=id===w.id;s.answered=true;const independent=ok&&!s.hint;if(!q.retry){s.tested++;if(independent)s.correct++;else if(s.hint)s.assisted++;record(w.id,q.type,independent)}if(!ok&&!q.retry){s.items.push({...q,retry:true});s.retries++}document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(b.dataset.answer===w.id)b.classList.add('right');else if(b.dataset.answer===id)b.classList.add('wrong')});document.querySelectorAll('.letter,[data-action="check-spelling"],[data-action="hint"]').forEach(b=>b.disabled=true);$('#feedback').className='feedback'+(independent?'':' again');$('#feedback').innerHTML=`<div><strong>${independent?'✦ 答對了！':ok?'🌱 跟著提示完成了！':'🌱 沒關係，一起記住它。'}</strong><p><b lang="en">${esc(w.en)}</b> · ${esc(w.zh)}${!ok&&!q.retry?'。稍後再試一次。':s.hint?'。明天再試著自己想起來。':''}</p></div><button class="btn primary" data-action="next">${s.index+1===s.items.length?'完成任務':'下一步'} →</button>`;$('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){if(!session)return;if(current().type!=='learn'&&!session.answered)return;session.index++;session.answered=false;session.hint=false;session.spelling=[];session.choices=null;session.letterbank=null;if('speechSynthesis'in window)speechSynthesis.cancel();renderSession();window.scrollTo(0,0)}
function finishSession(){const s=session,p=profile(),newDay=!p.days.includes(day());if(newDay)p.days.push(day());p.sessions++;save();session=null;route='result';$('#view').innerHTML=`<div class="session"><section class="card exercise"><div class="success-icon">🌷</div><span class="pill">TODAY’S LITTLE WIN</span><h1 style="margin-top:20px">今天的小花，開了！</h1><p class="muted">完成練習就是進步。休息一下，明天再來。</p><div class="result-words">${s.selected.map(id=>{const w=word(id);return `<span>${esc(w.emoji)} ${esc(w.en)}</span>`}).join('')}</div><div class="stats" style="margin:25px 0"><div><strong style="font-size:27px">${s.selected.length}</strong><p class="note">練習的單字</p></div><div><strong style="font-size:27px">${s.correct} / ${s.tested}</strong><p class="note">首次無提示答對</p></div><div><strong style="font-size:27px">${p.days.length}</strong><p class="note">累積完成天數</p></div></div><p class="note">${newDay?'✦ 今天的貼紙進度已保存。':'今天已經累積過一天；這一輪的答題紀錄也保留了。'}<br>需要提示或答錯的內容，明天會再陪你練習。</p><div class="row wrap" style="justify-content:center"><button class="btn primary" data-action="growth">看看我的成長 →</button><button class="btn" data-action="home">回到首頁</button></div></section></div>`;window.scrollTo(0,0)}
function showModal(html){lastFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${html}</section></div>`;document.body.style.overflow='hidden';const first=$('#modal-root button');if(first)first.focus()}
function closeModal(){document.body.style.overflow='';$('#modal-root').innerHTML='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function openConfirm(title,text,confirmAction){showModal(`<h2 id="modal-title">${esc(title)}</h2><p class="muted" style="margin-top:18px">${esc(text)}</p><div class="row wrap"><button class="btn" id="cancel-modal">取消</button><button class="btn primary" id="confirm-modal">確定</button></div>`);$('#cancel-modal').onclick=closeModal;$('#confirm-modal').onclick=()=>{closeModal();confirmAction()}}
function parents(){if(session){toast('請先完成或離開練習，再開啟家長工具。');return}loadVoices();const p=profile();showModal(`<div class="row spread"><h2 id="modal-title">家長的小工具</h2><button class="iconbtn" data-action="close-modal" aria-label="關閉">×</button></div><p class="note" style="margin-top:12px">不需要註冊。此頁沒有密碼鎖，僅供家庭試用。</p><section class="card"><h3>學習者與練習方式</h3><form id="settings-form" class="stack"><div class="fields"><label>目前學習者的暱稱<input name="name" maxlength="16" required value="${esc(p.name)}"></label><label>練習模式<select name="mode"><option value="easy" ${p.mode==='easy'?'selected':''}>輕鬆聽讀（不用拼字）</option><option value="spell" ${p.mode==='spell'?'selected':''}>拼字挑戰（點選字母）</option></select></label><label>每輪最多幾個新字<select name="count">${[1,3,5].map(n=>`<option value="${n}" ${n===store.settings.newCount?'selected':''}>${n} 個</option>`).join('')}</select></label><label>朗讀速度<select name="rate">${[[.7,'慢慢聽'],[.85,'稍慢（預設）'],[1,'正常速度']].map(([n,t])=>`<option value="${n}" ${n===store.settings.rate?'selected':''}>${t}</option>`).join('')}</select></label><label class="full">英文聲音<select name="voice"><option value="">裝置預設英文聲音</option>${voices.map(v=>`<option value="${esc(v.name)}" ${v.name===store.settings.voice?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></label></div><div class="row wrap"><button class="btn primary" type="submit">儲存設定</button><button class="btn" type="button" id="test-voice">♫ 試聽英文</button></div><p class="note" style="margin:0">朗讀使用裝置提供的語音；聲音品質與離線可用性視裝置而定。不是錄音評分。</p></form></section><section class="card"><h3>新增學校或生活單字</h3><form id="word-form" class="stack"><div class="fields"><label>英文單字<input name="en" required maxlength="40" placeholder="例如：school" pattern="[a-zA-Z][a-zA-Z -]{0,39}"></label><label>中文意思<input name="zh" required maxlength="60" placeholder="例如：學校"></label><label class="full">英文例句（選填）<input name="sentence" maxlength="180" placeholder="例如：I go to school."></label><label class="full">例句中文（選填）<input name="translation" maxlength="180" placeholder="例如：我去上學。"></label></div><button class="btn primary" type="submit">＋ 加到我們家的單字</button><p class="note" style="margin:0">由家長確認意思與例句。每個自訂單字會存於此裝置，其他裝置需匯入備份。</p></form></section><section class="card"><h3>教材與進度備份</h3><p class="note">備份包含所有學習者、教材與進度。換 iPad 可匯入；匯入會取代這台裝置的現有資料。不要將孩子姓名或備份放到公開網站。</p><div class="row wrap"><button class="btn" id="export-button">↓ 匯出備份</button><button class="btn" id="import-button">↑ 匯入備份</button><input type="file" id="import-file" class="hidden" accept=".json,application/json"></div><button class="btn danger" style="margin-top:16px" id="reset-button">清除目前學習者的進度</button></section><section class="card"><h3>在 iPad 使用</h3><p class="note">使用 Safari 開啟網址，再從分享選單加入主畫面。首次使用請保持連線。文字介面會嘗試快取，但朗讀不保證能離線使用。</p><p class="note" style="margin-bottom:0">30 個自編示範單字，含生活短句；emoji 僅作輔助，不是嚴格的看圖辨識教材。暱稱、自訂字與答題紀錄不由本網站上傳；瀏覽器語音服務可能使用網路。請定期匯出備份。</p></section>`);
 $('#settings-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);p.name=String(f.get('name')).trim().slice(0,16)||'學習者';p.mode=f.get('mode')==='spell'?'spell':'easy';store.settings.newCount=Number(f.get('count'));store.settings.rate=Number(f.get('rate'));store.settings.voice=String(f.get('voice'));save();syncProfile();render();toast('設定已儲存。')};
 $('#test-voice').onclick=()=>{const f=new FormData($('#settings-form'));store.settings.rate=Number(f.get('rate'));store.settings.voice=String(f.get('voice'));speak('Hello! Let’s learn English together.')};
 $('#word-form').onsubmit=e=>{e.preventDefault();if(store.custom.length>=500){toast('試用版最多 500 個自訂單字。');return}const f=new FormData(e.target),en=String(f.get('en')).trim().toLowerCase(),zh=String(f.get('zh')).trim();if(!/^[a-z][a-z -]{0,39}$/.test(en)||!zh){toast('請填入英文單字和中文意思。');return}if(words().some(w=>w.en.toLowerCase()===en)){toast('這個單字已經在花園裡了。');return}store.custom.push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),en,zh:zh.slice(0,60),emoji:'📝',topic:'custom',sentence:String(f.get('sentence')).trim().slice(0,180),translation:String(f.get('translation')).trim().slice(0,180),note:''});save();e.target.reset();render();toast('已新增 '+en+'，可以在「自訂單字」練習。')};
 $('#export-button').onclick=()=>{const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='word-garden-backup-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('已準備備份檔案。')};
 $('#import-button').onclick=()=>$('#import-file').click();$('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>2000000){toast('檔案太大，請選擇 2 MB 以內的備份。');return}try{const clean=validate(JSON.parse(await file.text()));openConfirm('取代這台裝置的資料？','會匯入 '+clean.profiles.length+' 位學習者及 '+clean.custom.length+' 個自訂單字。請先備份現有資料。',()=>{store=clean;save();go('home');toast('備份已匯入。')})}catch(err){toast(err.message||'無法讀取備份。')}};
 $('#reset-button').onclick=()=>openConfirm('清除 '+p.name+' 的進度？','自訂教材和其他學習者不受影響。此動作無法復原，建議先匯出備份。',()=>{p.progress={};p.days=[];p.sessions=0;save();render();toast('目前學習者的進度已清除。')});
}
// Delegate only declared UI actions; imported content is escaped and never executable.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav)return navigate(b.dataset.nav);if(b.dataset.say)return speak(word(b.dataset.say)?.en);if(b.dataset.sentence)return speak(word(b.dataset.sentence)?.sentence);if(b.dataset.topic){filter=b.dataset.topic;query='';return go('garden')}if(b.dataset.filter){filter=b.dataset.filter;return renderGarden()}if(b.dataset.answer)return answer(b.dataset.answer);if(b.dataset.letter!==undefined&&session&&!session.answered){const i=Number(b.dataset.letter);if(!session.spelling.includes(i))session.spelling.push(i);return renderLetters()}if(b.dataset.remove!==undefined&&session&&!session.answered){session.spelling.splice(Number(b.dataset.remove),1);return renderLetters()}switch(b.dataset.action){case 'start':return startSession();case 'topic-practice':return startSession(visibleWords());case 'review':return startSession(words(),true);case 'next':return next();case 'garden':case 'home':case 'growth':return navigate(b.dataset.action);case 'parents':return parents();case 'close-modal':return closeModal();case 'exit':return navigate('home');case 'hint':if(session&&!session.answered){session.hint=true;$('#hinttext').innerHTML=`提示：<strong lang="en">${esc(word(current().id).en)}</strong>（會列入明天複習）`}return;case 'check-spelling':if(session&&!session.answered){const spelling=session.spelling.map(i=>session.letterbank[i].v).join('');return answer(spelling===word(current().id).en.toLowerCase()?current().id:'wrong')}return}});
$('#parent-button').onclick=parents;
$('#profile').onchange=e=>{const nextId=e.target.value;if(session){e.target.value=store.active;openConfirm('切換學習者？','未完成的這一輪會結束；已作答的進度會保留。',()=>{session=null;store.active=nextId;save();go('home')})}else{store.active=nextId;save();go('home')}};
document.addEventListener('keydown',e=>{const modal=$('#modal-root .modal');if(!modal)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const controls=[...modal.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled&&!x.classList.contains('hidden'));if(!controls.length)return;const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{const nextRoute=location.hash.slice(1);if(['home','garden','growth'].includes(nextRoute)&&nextRoute!==route){if(session){location.hash='practice';navigate(nextRoute)}else go(nextRoute)}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){toast('另一個分頁更新了資料。請避免在多個分頁同時練習，重新整理後再繼續。')}});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
syncProfile();const initial=location.hash.slice(1);if(['home','garden','growth'].includes(initial))route=initial;render();
</script>
